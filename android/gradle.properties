# Configurações do Gradle para o projeto.

# Mais memória pro build (Android costuma precisar).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Usa o namespace do AndroidX (padrão moderno de bibliotecas do Android).
android.useAndroidX=true

# Builds em paralelo e com cache = mais rápido.
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin: gera código estilo oficial.
kotlin.code.style=official
